; charcoal-smoker firmware - Phase 1 (ESP32-S3 N8R8, Arduino-ESP32 3.x via pioarduino)
;
; VERIFIED 2026-09-20 (build in clean container):
;   platform URL: https://github.com/pioarduino/platform-espressif32 (README, stable). Resolved to platform 55.03.312,
;   framework-arduinoespressif32 3.3.12 (README text still said 3.3.11), Adafruit BusIO 1.17.4.
;   board id esp32-s3-devkitc1-n8r8: boards/esp32-s3-devkitc1-n8r8.json in that repo (qio_opi, BOARD_HAS_PSRAM)
;   NimBLE-Arduino 2.5.1: https://github.com/h2zero/NimBLE-Arduino (library.properties at tag 2.5.1)
;   Adafruit MAX31856 1.2.8: https://github.com/adafruit/Adafruit_MAX31856 (library.properties, master)
;
; Official platformio/espressif32 (7.1.0) still ships Arduino 2.0.17 (IDF 4.4.7) and does NOT
; support Arduino 3.x. Do not switch back to "platform = espressif32" without porting LEDC and
; task-watchdog calls to the 2.x API.

[platformio]
; Bench 2026-09-26: ESP32-S3-DevKitC-1 (N8R8) in hand. Both MAX31855 boards failed the shorted-input test and were
; returned (doc 03); the pit sensor is the MAX31856, due 2026-09-29 to 10-02. Bench env is s3-n8r8-uart.
; The WROVER and WROOM envs stay as fallbacks; see doc 04 pin maps.
default_envs = s3-n8r8-uart
description = Temperature-controlled charcoal smoker controller (PWM blower, K-type pit probe, BLE)

[env]
extra_scripts = pre:load_env.py
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
    https://github.com/adafruit/Adafruit_MAX31856.git#1.2.8
    https://github.com/adafruit/Adafruit_BusIO.git#1.17.4

[env:s3-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
; This board's console ports: native USB = Espressif VID 303A, UART bridge = WCH CH343 VID 1A86.
; With ARDUINO_USB_CDC_ON_BOOT=1 Serial goes to the NATIVE port; the IDF log lines still come out of UART0,
; which is why the CH343 port shows logs but no CSV. Use env s3-n8r8-uart-max31855 to put everything on the CH343.
monitor_dtr = 1
monitor_rts = 0
; USB-CDC on the native USB port; set to 0 if flashing/monitoring via the UART USB-C port
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:s3-n8r8-max31855]
extends = env:s3-n8r8
build_flags =
    ${env:s3-n8r8.build_flags}
    -DPIT_SENSOR_MAX31855

; ESP32-WROOM-32 dev board (classic ESP32, 4 MB flash, UART bridge, BLE 4.2). board id esp32dev.
[env:wroom32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
build_flags =
    ${env.build_flags}

[env:wroom32-max31855]
extends = env:wroom32
build_flags =
    ${env:wroom32.build_flags}
    -DPIT_SENSOR_MAX31855

; Freenove ESP32-WROVER camera board (classic ESP32 + 8 MB PSRAM, camera pins reserved). Pin map in include/pins.h.
[env:freenove-wrover-max31855]
extends = env:wroom32
build_flags =
    ${env:wroom32.build_flags}
    -DBOARD_FREENOVE_WROVER
    -DPIT_SENSOR_MAX31855

[env:freenove-wrover]
extends = env:wroom32
build_flags =
    ${env:wroom32.build_flags}
    -DBOARD_FREENOVE_WROVER

; Native unit tests (control math only, no hardware). Run: pio test -e native
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -DNATIVE_TEST
build_src_filter = +<control/>
test_build_src = yes

; Console on the UART bridge (CH343, VID 1A86) instead of the native USB port: Serial goes to UART0,
; so the banner, the CSV and the console all come out of the UART-labelled USB-C port. Flash and monitor
; both on that port. This is the reliable bench console on this board.
[env:s3-n8r8-uart]
extends = env:s3-n8r8
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_echo = yes
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
monitor_dtr = 0
monitor_rts = 0

; Same console, MAX31855 backend. Kept as a fallback: no MAX31855 is on hand since 2026-09-26.
[env:s3-n8r8-uart-max31855]
extends = env:s3-n8r8
; Typing into the monitor: send_on_enter buffers the line until ENTER, monitor_echo shows what you type.
; (VERIFIED: docs.platformio.org core/userguide/device/cmd_monitor -- "--echo Enable local echo",
;  filter send_on_enter "Send a text to device on ENTER".)
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_echo = yes
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DPIT_SENSOR_MAX31855
monitor_dtr = 0
monitor_rts = 0
