<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Smoker</title>
<style>
  :root {
    --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a; --fg:#f2f4f8; --dim:#8b93a3;
    --accent:#ff7a2f; --ok:#35c46a; --warn:#f5b83d; --bad:#ff4d4f; --cool:#4aa3ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f7; --card:#fff; --card2:#eef0f3; --line:#dde1e7; --fg:#14171c; --dim:#6b7280; --warn:#a16207; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding:max(12px, env(safe-area-inset-top)) 16px 32px; max-width:560px; margin-inline:auto; }
  button { font:inherit; color:inherit; border:0; border-radius:12px; background:var(--card2); padding:12px 14px; cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-top:12px; }
  .dim { color:var(--dim); font-size:13px; }
  .hidden { display:none !important; }

  header { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:20px; margin:0; flex:1; user-select:none; -webkit-user-select:none; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--card2); font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .pill.on .dot { background:var(--ok); } .pill.stale .dot { background:var(--warn); }
  #connect { background:var(--accent); color:#fff; font-weight:600; padding:8px 14px; }

  .banner { border-radius:16px; padding:14px 16px; margin-top:12px; display:flex; gap:12px; align-items:flex-start; }
  .banner.bad { background:color-mix(in srgb, var(--bad) 18%, var(--card)); border:1px solid var(--bad); }
  .banner b { display:block; font-size:17px; }
  .banner p { margin:4px 0 0; font-size:14px; }
  .banner button { margin-left:auto; background:var(--bad); color:#fff; font-weight:600; white-space:nowrap; }

  .hero { display:flex; flex-direction:column; align-items:center; padding-top:20px; }
  .gauge { position:relative; width:240px; height:240px; margin-bottom:-30px; }
  .gauge svg { width:100%; height:100%; transform:rotate(135deg); }
  .gauge .track { stroke:var(--card2); } .gauge .arc { stroke:var(--accent); transition:stroke-dasharray .6s, stroke .3s; }
  .gauge .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #pit { font-size:64px; font-weight:700; letter-spacing:-2px; line-height:1; font-variant-numeric:tabular-nums; }
  #pitUnit { font-size:22px; color:var(--dim); font-weight:500; letter-spacing:0; }
  #state { margin-top:10px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; }
  .chip { padding:6px 10px; border-radius:999px; font-size:13px; font-weight:600;
          background:color-mix(in srgb, var(--warn) 20%, var(--card)); color:var(--warn); }

  .target { display:flex; align-items:center; gap:12px; margin-top:16px; width:100%; }
  .target .lbl { flex:1; } .target .lbl .v { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
  .step { width:48px; height:48px; font-size:24px; border-radius:50%; padding:0; }
  #setSp { background:var(--accent); color:#fff; font-weight:600; }
  #primary { width:100%; margin-top:16px; padding:16px; font-size:18px; font-weight:700; border-radius:14px; background:var(--accent); color:#fff; }
  #primary.stop { background:var(--card2); color:var(--bad); } #primary.confirm { background:var(--bad); color:#fff; }

  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tiles .card { margin-top:12px; }
  .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .big { font-size:26px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .bar { height:6px; border-radius:3px; background:var(--card2); margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--cool); transition:width .5s; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .presets button { padding:6px 10px; font-size:13px; border-radius:999px; }

  canvas { width:100%; height:200px; display:block; }
  .legend { display:flex; gap:14px; margin-top:8px; }
  .legend span::before { content:""; display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; background:var(--c); }
  .unit { display:flex; justify-content:center; gap:4px; margin-top:20px; }
  .unit button { padding:6px 14px; font-size:13px; } .unit button.sel { background:var(--accent); color:#fff; }

  #debug h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .raw { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; }
  .raw div { background:var(--card2); border-radius:10px; padding:8px 10px; }
  .raw .v { font:600 15px ui-monospace, monospace; margin-top:2px; word-break:break-all; }
  .row { display:flex; gap:8px; margin-top:10px; }
  #cmd { flex:1; min-width:0; font:14px ui-monospace, monospace; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #log { background:var(--bg); border-radius:10px; padding:8px; height:220px; overflow:auto; font:12px ui-monospace, monospace; white-space:pre-wrap; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Smoker</h1>
  <span id="conn" class="pill"><span class="dot"></span><span id="connTxt">Not connected</span></span>
  <button id="connect">Connect</button>
</header>

<div id="banner" class="banner bad hidden" role="alert">
  <div><b id="bTitle"></b><p id="bText"></p></div>
  <button id="clear">Clear</button>
</div>

<section class="card hero">
  <div class="gauge">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="414.7 552.9"/>
      <circle id="arc" class="arc" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 552.9"/>
    </svg>
    <div class="mid">
      <div class="dim">PIT</div>
      <div><span id="pit">--</span><span id="pitUnit">°F</span></div>
      <div id="state" class="pill">Idle</div>
    </div>
  </div>
  <div id="chips" class="chips"></div>

  <div class="target">
    <button class="step" id="spDown" aria-label="Lower target" disabled>−</button>
    <div class="lbl"><div class="k">Target</div><div class="v" id="sp">--</div></div>
    <button id="setSp" class="hidden" disabled>Set</button>
    <button class="step" id="spUp" aria-label="Raise target" disabled>+</button>
  </div>
  <button id="primary" disabled>Start cook</button>
</section>

<div class="tiles">
  <section class="card">
    <div class="k">Fan</div><div class="big" id="duty">--</div>
    <div class="bar"><i id="dutyBar"></i></div>
  </section>
  <section class="card">
    <div class="k">Timer</div><div class="big" id="timer">Off</div>
    <div class="presets" id="presets">
      <button data-m="30" disabled>30m</button><button data-m="60" disabled>1h</button>
      <button data-m="120" disabled>2h</button><button data-m="0" disabled>Off</button>
    </div>
  </section>
</div>

<section class="card">
  <div class="k">Last hour</div>
  <canvas id="chart"></canvas>
  <div class="legend dim"><span style="--c:var(--accent)">Pit</span><span style="--c:var(--dim)">Target</span><span style="--c:var(--cool)">Fan</span></div>
</section>

<div class="unit"><button data-u="F">°F</button><button data-u="C">°C</button></div>

<section id="debug" class="card hidden">
  <h2>Debug <button id="debugOff" style="padding:6px 10px;font-size:13px">Close</button></h2>
  <div class="raw" id="raw"></div>
  <div class="dim" id="info" style="margin-top:8px"></div>
  <div class="row">
    <input id="cmd" placeholder="console: d  ?  s 110  c  x  k  m 10  t 25  i" disabled autocapitalize="off" autocorrect="off">
    <button id="send" disabled>Send</button>
  </div>
  <div class="row"><button id="csv" disabled>Download CSV</button><button id="clrLog">Clear log</button></div>
  <div id="log"></div>
</section>

<script>
// Web Bluetooth front end for SMOKER-CTRL (doc 10 section 11). Chrome on PC or Android, Bluefy on iOS; bond first.
// Debug mode (raw values, console, CSV): tap the title 5 times, or open the page with #debug.
const BASE = '7a3b0000-6c1e-4f2a-9d5b-2c8e1f0a';
const U = n => BASE + n.toString(16).padStart(4, '0');
const SVC = U(1), PIT = U(2), SP = U(3), DUTY = U(4), STATE = U(5), FAULT = U(6), MODE = U(7),
      INFO = U(0xa), WARN = U(0xb), TIMER = U(0xc), CONSOLE = U(0xd), TELEM = U(0xe);
const STATES = ['IDLE','IGNITE','RAMP','HOLD','LID_OPEN','FAULT','MANUAL','RECOVERY'];
const FAULTS = ['NONE','SENSOR_OPEN','SENSOR_SHORT','SENSOR_RANGE','IGNITE_TIMEOUT','PIT_OVER_LIMIT','WATCHDOG_RESET','FIRE_OUT','BLOWER_STALL','BLOWER_RUNAWAY'];
const STATE_TXT = { IDLE:'Idle', IGNITE:'Lighting', RAMP:'Heating up', HOLD:'Holding', LID_OPEN:'Lid open',
                    FAULT:'Stopped', MANUAL:'Manual fan', RECOVERY:'Recovering' };
const FAULT_TXT = {
  SENSOR_OPEN: ['Probe not reading', 'Check the probe plug and its wiring, then tap Clear.'],
  SENSOR_SHORT: ['Probe wire shorted', 'Check the probe cable for damage or contact with the drum.'],
  SENSOR_RANGE: ['Probe reading out of range', 'Check the probe and its wiring.'],
  IGNITE_TIMEOUT: ['Fire did not take', 'No rise in 40 minutes. Check the fire and the intake, then Clear and start again.'],
  PIT_OVER_LIMIT: ['Pit too hot', 'Fan stopped. Close the intake and partly close the exhaust; do not open the lid. Clear once it is below LIMIT.'],
  WATCHDOG_RESET: ['Controller restarted', 'Tap Clear and check the cook.'],
  FIRE_OUT: ['Fire went out', 'Pit stayed far below target with the fan at max. Add or relight charcoal, then Clear and start again.'],
  BLOWER_STALL: ['Fan not spinning', 'Check the 12 V supply, the fuse and the fan plug, then tap Clear.'],
  BLOWER_RUNAWAY: ['Fan out of control', 'Fan power was cut. Check the fan speed wire (blue), then tap Clear.'],
};
const WARN_TXT = ['Running hot', 'Running cold', 'Add charcoal', 'Hot with fan off: check for air leaks', 'Lid open', 'Timer done: cook stopped'];
const SP_MIN = 60, SP_MAX = 200, OVER_MARGIN = 40, OVER_CAP = 240;   // config.h
const CSV_HEAD = 't_s,state,fault,pit_raw_c,pit_filt_c,cj_c,duty_cmd,duty_applied,tc_fault_bits,warnings,out_ema,rate_c_s,fan_rpm,timer_s';

const $ = id => document.getElementById(id);
const dec = new TextDecoder(), enc = new TextEncoder();
// Browser storage only holds the unit and debug toggles; it can throw or be empty (private mode, previews).
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let ch = {}, connected = false, consoleBuf = '', telemBuf = '', confirmUntil = 0;
let unit = store.get('smokerUnit') === 'C' ? 'C' : 'F';
let spEdit = null;   // pending target in C while the user is stepping, null when it matches the board
const cur = { pit: NaN, sp: NaN, duty: 0, state: 'IDLE', fault: 'NONE', warn: 0, timer: 0, t: 0, f: [] };
const hist = [];     // {t, pit, sp, duty}
const csvLines = [CSV_HEAD];

const toU = c => unit === 'F' ? c * 9 / 5 + 32 : c;
const fmt = c => Number.isFinite(c) ? Math.round(toU(c)).toString() : '--';
const limitC = sp => Math.min(sp + OVER_MARGIN, OVER_CAP);

function log(s) { const el = $('log'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight; }

function render() {
  const busy = !['IDLE', 'FAULT'].includes(cur.state);
  $('pit').textContent = fmt(cur.pit);
  $('pitUnit').textContent = '°' + unit;
  const sp = spEdit ?? cur.sp;
  $('sp').textContent = Number.isFinite(sp) ? fmt(sp) + '°' + unit : '--';
  $('setSp').classList.toggle('hidden', spEdit === null);
  for (const b of document.querySelectorAll('.unit button')) b.classList.toggle('sel', b.dataset.u === unit);

  // Ring: share of the way from ambient (20 C) to target; green inside +/-5 C, red at the over-limit warning band.
  const frac = Number.isFinite(cur.pit) && Number.isFinite(cur.sp) ? Math.max(0, Math.min(1, (cur.pit - 20) / Math.max(cur.sp - 20, 1))) : 0;
  const arc = $('arc');
  arc.setAttribute('stroke-dasharray', (414.7 * frac).toFixed(1) + ' 552.9');
  arc.style.stroke = cur.fault !== 'NONE' || cur.warn & 1 ? 'var(--bad)' : busy && Math.abs(cur.pit - cur.sp) <= 5 ? 'var(--ok)' : 'var(--accent)';

  const st = $('state');
  st.textContent = STATE_TXT[cur.state] ?? cur.state;
  st.style.color = cur.state === 'FAULT' ? 'var(--bad)' : cur.state === 'HOLD' ? 'var(--ok)' : busy ? 'var(--accent)' : '';

  const f = FAULT_TXT[cur.fault];
  $('banner').classList.toggle('hidden', cur.fault === 'NONE');
  if (f) {
    $('bTitle').textContent = f[0];
    $('bText').textContent = f[1].replace('LIMIT', Number.isFinite(cur.sp) ? fmt(limitC(cur.sp)) + '°' + unit : 'the limit');
  }
  $('chips').replaceChildren(...WARN_TXT.filter((_, i) => cur.warn & (1 << i)).map(t => Object.assign(document.createElement('span'), { className: 'chip', textContent: t })));

  const p = $('primary');
  p.classList.remove('stop', 'confirm');
  if (cur.state === 'FAULT') { p.textContent = 'Clear the problem first'; p.disabled = true; }
  else if (busy) { const c = Date.now() < confirmUntil; p.textContent = c ? 'Tap again to stop' : 'Stop cook'; p.classList.add(c ? 'confirm' : 'stop'); p.disabled = !connected; }
  else { p.textContent = 'Start cook'; p.disabled = !connected; }

  $('duty').textContent = connected ? cur.duty + '%' : '--';
  $('dutyBar').style.width = cur.duty + '%';
  const s = cur.timer;
  $('timer').textContent = s > 0 ? (s >= 3600 ? Math.floor(s / 3600) + 'h ' : '') + String(Math.floor(s % 3600 / 60)).padStart(s >= 3600 ? 2 : 1, '0') + 'm' : 'Off';
  renderRaw();
  draw();
}

function renderRaw() {
  if ($('debug').classList.contains('hidden')) return;
  const names = CSV_HEAD.split(',');
  $('raw').replaceChildren(...names.map((n, i) => {
    const d = document.createElement('div');
    d.innerHTML = '<div class="k"></div><div class="v"></div>';
    d.firstChild.textContent = n; d.lastChild.textContent = cur.f[i] ?? '--';
    return d;
  }));
}

function onTelem(e) {
  telemBuf += dec.decode(e.target.value);
  let i;
  while ((i = telemBuf.indexOf('\n')) >= 0) {
    const line = telemBuf.slice(0, i); telemBuf = telemBuf.slice(i + 1);
    const f = line.split(',');
    if (f.length < 13) continue;
    csvLines.push(line);
    Object.assign(cur, { f, state: f[1], fault: f[2], pit: +f[4], duty: +f[6], warn: parseInt(f[9], 16) || 0, t: Date.now() });
    if (f.length > 13) cur.timer = +f[13];   // from telemetry: Bluefy does not deliver the 000c notify
    hist.push({ t: cur.t, pit: cur.pit, sp: cur.sp, duty: cur.duty });
    while (hist.length && cur.t - hist[0].t > 3600e3) hist.shift();
    render();
  }
}
function onConsole(e) {
  consoleBuf += dec.decode(e.target.value);
  let i;
  while ((i = consoleBuf.indexOf('\n')) >= 0) { log(consoleBuf.slice(0, i)); consoleBuf = consoleBuf.slice(i + 1); }
}

function draw() {
  const c = $('chart'), dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (c.width !== Math.round(W * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  g.font = '11px system-ui, sans-serif';
  if (hist.length < 2) { g.fillStyle = col('--dim'); g.textAlign = 'center'; g.fillText(connected ? 'Collecting data…' : 'Connect to see the cook', W / 2, H / 2); return; }
  const L = 34, R = 6, T = 8, B = 18, t0 = hist[0].t, t1 = hist[hist.length - 1].t, span = Math.max(t1 - t0, 60e3);
  const temps = hist.flatMap(h => [h.pit, h.sp]).filter(Number.isFinite).map(toU);
  // Round axis: a 1/2/5 x 10^n step giving about three gridlines.
  const raw = Math.max(Math.max(...temps) - Math.min(...temps), 10) / 3, mag = 10 ** Math.floor(Math.log10(raw));
  const stp = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = Math.floor(Math.min(...temps) / stp) * stp, hi = Math.ceil(Math.max(...temps) / stp) * stp;
  const x = t => L + (t - t0) / span * (W - L - R), yT = v => T + (hi - toU(v)) / (hi - lo) * (H - T - B), yD = v => H - B - v / 100 * (H - T - B) * 0.35;
  g.strokeStyle = col('--line'); g.fillStyle = col('--dim'); g.textAlign = 'right'; g.lineWidth = 1;
  for (let v = lo; v <= hi + stp / 2; v += stp) { const y = T + (hi - v) / (hi - lo) * (H - T - B); g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); g.fillText(v.toFixed(0), L - 6, y + 4); }
  g.textAlign = 'left'; g.fillText('−' + Math.round(span / 60e3) + ' min', L, H - 4); g.textAlign = 'right'; g.fillText('now', W - R, H - 4);
  // fan as a filled band along the bottom
  g.beginPath(); g.moveTo(x(t0), yD(0));
  for (const h of hist) g.lineTo(x(h.t), yD(h.duty));
  g.lineTo(x(t1), yD(0)); g.closePath(); g.fillStyle = col('--cool') + '40'; g.fill();
  const line = (key, style, width, dash) => { g.strokeStyle = style; g.lineWidth = width; g.setLineDash(dash); g.beginPath(); let first = true;
    for (const h of hist) { if (!Number.isFinite(h[key])) continue; const px = x(h.t), py = yT(h[key]); first ? g.moveTo(px, py) : g.lineTo(px, py); first = false; }
    g.stroke(); g.setLineDash([]); };
  line('sp', col('--dim'), 1.5, [5, 5]); line('pit', col('--accent'), 2.5, []);
}

function setConn(txt, cls) { $('connTxt').textContent = txt; $('conn').className = 'pill ' + (cls || ''); }
function enable(on) {
  connected = on;
  for (const id of ['spDown', 'spUp', 'setSp', 'cmd', 'send', 'csv']) $(id).disabled = !on;
  for (const b of document.querySelectorAll('#presets button')) b.disabled = !on;
  $('connect').classList.toggle('hidden', on);
  render();
}

async function connect() {
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'SMOKER-CTRL' }], optionalServices: [SVC] });
    dev.addEventListener('gattserverdisconnected', () => { setConn('Disconnected'); enable(false); $('connect').disabled = false; log('# disconnected'); });
    setConn('Connecting…'); $('connect').disabled = true;
    const srv = await (await dev.gatt.connect()).getPrimaryService(SVC);
    for (const [k, u] of Object.entries({ PIT, SP, DUTY, STATE, FAULT, MODE, INFO, WARN, TIMER, CONSOLE, TELEM })) ch[k] = await srv.getCharacteristic(u);
    $('info').textContent = dec.decode(await ch.INFO.readValue());
    cur.sp = (await ch.SP.readValue()).getFloat32(0, true);
    cur.state = STATES[(await ch.STATE.readValue()).getUint8(0)] ?? 'IDLE';
    cur.fault = FAULTS[(await ch.FAULT.readValue()).getUint8(0)] ?? 'NONE';
    cur.warn = (await ch.WARN.readValue()).getUint8(0);
    cur.timer = (await ch.TIMER.readValue()).getUint16(0, true) * 60;
    ch.SP.addEventListener('characteristicvaluechanged', e => { cur.sp = e.target.value.getFloat32(0, true); if (spEdit !== null && Math.abs(spEdit - cur.sp) < 0.01) spEdit = null; render(); });
    ch.WARN.addEventListener('characteristicvaluechanged', e => { cur.warn = e.target.value.getUint8(0); render(); });
    ch.TELEM.addEventListener('characteristicvaluechanged', onTelem);
    ch.CONSOLE.addEventListener('characteristicvaluechanged', onConsole);
    for (const k of ['SP', 'WARN', 'TELEM', 'CONSOLE']) await ch[k].startNotifications();
    cur.t = Date.now(); setConn('Connected', 'on'); enable(true); log('# connected');
  } catch (err) { log('! ' + err.message); setConn('Connect failed'); $('connect').disabled = false; }
}

// Writes need the bonded, encrypted link; the browser raises the pairing prompt on the first one if not bonded.
// Bluefy (iOS) and older Chrome only have writeValue; newer Chrome has writeValueWithResponse.
const w = (k, buf) => {
  log('> ' + k + ' ' + Array.from(new Uint8Array(buf instanceof ArrayBuffer ? buf : buf.buffer)).join(' '));
  try {
    return (ch[k].writeValueWithResponse ? ch[k].writeValueWithResponse(buf) : ch[k].writeValue(buf))
      .catch(err => log('! ' + k + ' write failed: ' + (err && err.message || err)));
  } catch (err) { log('! ' + k + ' write threw: ' + (err && err.message || err)); }
};
const u8 = v => Uint8Array.of(v);
// Console lines go to 000d. The timer uses it too (`a <min>`): the native 000c write never left Bluefy (2026-10-23).
const cmd = s => w('CONSOLE', enc.encode(s));

$('connect').onclick = connect;
$('clear').onclick = () => w('MODE', u8(3));
$('primary').onclick = () => {
  if (cur.state === 'IDLE' || cur.state === 'FAULT') { w('MODE', u8(0)); return; }
  if (Date.now() < confirmUntil) { confirmUntil = 0; w('MODE', u8(2)); }
  else { confirmUntil = Date.now() + 3000; setTimeout(render, 3100); }
  render();
};
const stepSp = dir => {
  // 5 degree steps in the display unit, clamped to the firmware's 60 to 200 C.
  const base = spEdit ?? cur.sp, stepC = unit === 'F' ? 5 * 5 / 9 : 5;
  if (!Number.isFinite(base)) return;
  const u = Math.round(toU(base) / 5) * 5 + dir * 5;
  spEdit = Math.min(SP_MAX, Math.max(SP_MIN, unit === 'F' ? (u - 32) * 5 / 9 : u));
  if (Math.abs(spEdit - cur.sp) < stepC / 10) spEdit = null;
  render();
};
$('spDown').onclick = () => stepSp(-1);
$('spUp').onclick = () => stepSp(1);
$('setSp').onclick = () => { const b = new DataView(new ArrayBuffer(4)); b.setFloat32(0, spEdit, true); w('SP', b.buffer); };
for (const b of document.querySelectorAll('#presets button')) b.onclick = () => cmd('a ' + b.dataset.m);
for (const b of document.querySelectorAll('.unit button')) b.onclick = () => { unit = b.dataset.u; store.set('smokerUnit', unit); render(); };
const send = () => { const s = $('cmd').value.trim(); if (!s) return; cmd(s); $('cmd').value = ''; };
$('send').onclick = send; $('cmd').onkeydown = e => { if (e.key === 'Enter') send(); };
$('clrLog').onclick = () => { $('log').textContent = ''; };
$('csv').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csvLines.join('\n') + '\n'], { type: 'text/csv' }));
  a.download = 'smoker-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16) + '.csv'; a.click(); };

// Hidden debug mode. Not a security boundary: every write still needs the bonded, passkey-protected BLE link.
const setDebug = on => { $('debug').classList.toggle('hidden', !on); store.set('smokerDebug', on ? '1' : ''); render(); };
let taps = [];
$('title').onclick = () => { const now = Date.now(); taps = taps.filter(t => now - t < 3000).concat(now); if (taps.length >= 5) { taps = []; setDebug(true); } };
$('debugOff').onclick = () => setDebug(false);
if (location.hash === '#debug' || store.get('smokerDebug') === '1') setDebug(true);

// Stale-data watch: telemetry arrives every second while connected.
setInterval(() => { if (connected) setConn(Date.now() - cur.t > 5000 ? 'No data' : 'Connected', Date.now() - cur.t > 5000 ? 'stale' : 'on'); }, 1000);
window.addEventListener('resize', draw);
if (!navigator.bluetooth) { log('! Web Bluetooth not available: use Chrome or Edge on Windows, Android or macOS. iOS needs the Bluefy browser.'); $('connect').disabled = true; setConn('No Bluetooth in this browser'); }
render();
</script>
